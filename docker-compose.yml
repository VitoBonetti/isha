services:
  isha-db:
    image: postgres:16-alpine
    container_name: isha-db-prod
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  isha-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isha-backend-prod
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - isha-db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
    container_name: isha-frontend-prod
    restart: always
    depends_on:
      - isha-backend
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata: