steps:
  # 1. Build the Sherlock Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/gcp-repo/sherlock-worker:$COMMIT_SHA'
      - '.'
    dir: 'sherlock-worker'

  # 2. Push the Docker Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/gcp-repo/sherlock-worker:$COMMIT_SHA'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sherlock-worker'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/gcp-repo/sherlock-worker:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--no-allow-unauthenticated' # Requires IAM Token
      - '--service-account'
      - 'gcp-df-gostplanner-sbx-backend@df-gost-planner-sbx-57d9.iam.gserviceaccount.com'
      - '--network'
      - 'gcp-vpc'
      - '--subnet'
      - 'gcp-vpc-subnet'
      - '--vpc-egress'
      - 'private-ranges-only'
      - '--no-cpu-throttling'
      - '--min-instances'
      - '0' # Scale to zero when idle
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,LOCATION=europe-west1,DB_INSTANCE_NAME=gcp-df-gostplanner-sbx-db,POSTGRES_DB=gostplanner-sbx-db,IAM_SA_EMAIL=gcp-df-gostplanner-sbx-backend@df-gost-planner-sbx-57d9.iam.gserviceaccount.com,INTAKE_BUCKET_NAME=gcp-df-gostplanner-sbx-intake-artifacts-bucket,GEMINI_KEY_NAME=gcp-luigi-key,MAIN_BACKEND_URL=https://gostplannersbx.ddns.net,IAP_CLIENT_ID=114457953986-04hqpgf4i4ellvv51q84at2l26argjie.apps.googleusercontent.com'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/gcp-repo/sherlock-worker:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY